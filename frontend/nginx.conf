server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Forward API calls to the backend container, removing the /api prefix.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Allow WebSocket connections (live chat) and long AI replies.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # Candidates' private interview links hold a secret, so these page
    # addresses are not written to the access log.
    location /interview/ {
        access_log off;
        try_files $uri /index.html;
    }

    # Let React Router handle page addresses such as /app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}